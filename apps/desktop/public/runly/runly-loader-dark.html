<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runly ERP — Cargando (dark)</title>
</head>
<body>


<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Sora', system-ui, sans-serif; }
  a { color: #F5411E; text-decoration: none; }
  a:hover { color: #FFB020; }
  @keyframes rl3-draw {
    0%        { stroke-dashoffset: 1; }
    22%, 88%  { stroke-dashoffset: 0; }
    100%      { stroke-dashoffset: -1; }
  }
  @keyframes rl3-flood {
    0%, 22%   { transform: translateY(1360px); }
    54%, 58%  { transform: translateY(-130px); }
    88%, 100% { transform: translateY(1360px); }
  }
  @keyframes rl3-wave { 0% { transform: translateX(0px); } 100% { transform: translateX(-520px); } }
  @keyframes rl3-breathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.025); }
  }
  @keyframes rl3-glow {
    0%, 100% { opacity: 0.22; transform: scale(0.9); }
    62%      { opacity: 0.6; transform: scale(1.06); }
  }
  @keyframes rl3-bar {
    0%   { transform: translateX(-105%) scaleX(0.32); }
    55%  { transform: translateX(55%) scaleX(0.52); }
    100% { transform: translateX(300%) scaleX(0.32); }
  }
  @keyframes rl3-rise {
    0%   { opacity: 0; transform: translateY(14px); }
    100% { opacity: 1; transform: translateY(0px); }
  }
</style>


<div style="position:relative;width:100%;min-height:100vh;display:grid;place-items:center;overflow:hidden;background:#070C16">
  <div style="position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 40%, #131C2E 0%, #0A111D 55%, #05080F 100%)"></div>

  <div style="position:relative;display:flex;flex-direction:column;align-items:center;gap:46px;padding:48px">

    <div style="position:relative;width:280px;height:280px;display:grid;place-items:center">
      <div style="position:absolute;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle, rgba(245,65,30,0.34) 0%, rgba(245,65,30,0.12) 48%, rgba(245,65,30,0) 72%);filter:blur(8px);animation:rl3-glow 3.2s ease-in-out infinite"></div>

      <div style="position:relative;width:216px;height:216px;animation:rl3-breathe 3.2s ease-in-out infinite">
        <svg viewBox="0 0 1254 1254" width="216" height="216" style="display:block;overflow:visible">
          <defs>
            <path id="p3Body" pathLength="1" d="M728.52 1075.94 c-3.06 -0.73 -8.08 -2.94 -11.14 -4.78 -8.45 -4.90 -9.43 -6 -120.99 -136.91 -14.70 -17.27 -77.64 -90.62 -104.58 -121.73 -28.17 -32.57 -88.91 -102.13 -110.21 -126.01 -11.39 -12.86 -21.68 -25.59 -22.90 -28.29 -9.67 -22.29 3.80 -47.15 31.72 -58.41 l6.98 -2.82 173.28 -0.61 c172.18 -0.61 173.28 -0.73 182.47 -3.31 27.68 -7.84 48 -24 59.52 -47.51 7.47 -15.31 9.55 -24 9.55 -41.02 0 -16.53 -2.08 -25.84 -8.82 -39.19 -7.84 -15.68 -20.82 -26.94 -39.31 -34.17 l-8.08 -3.18 -191.53 -0.37 -191.41 -0.24 8.57 9.43 c4.78 5.27 29.88 30.74 55.84 56.70 25.96 25.96 47.27 48 47.27 48.98 0 4.90 0.37 4.90 -96.62 4.90 -102.38 0 -101.89 0 -118.91 -7.23 -25.84 -10.78 -51.56 -34.66 -64.05 -59.52 -1.59 -3.31 -4.65 -10.78 -6.49 -16.53 l-3.55 -10.41 0 -87.56 c0 -97.97 -0.37 -93.56 8.82 -108.75 8.57 -14.08 22.90 -26.21 36.62 -30.86 3.80 -1.35 11.39 -2.94 16.78 -3.67 13.35 -1.59 550.95 -1.71 574.10 0 41.39 2.94 77.89 13.72 107.77 31.72 17.27 10.53 29.02 19.47 43.23 33.19 43.11 41.64 72.99 102.74 81.07 165.57 2.45 19.96 1.84 60.37 -1.22 77.52 -11.39 62.21 -46.29 122.83 -93.68 162.38 -32.08 26.94 -73.48 47.88 -110.95 56.21 -26.08 5.88 -32.21 6.49 -75.93 6.98 -23.51 0.24 -43.60 0.73 -44.45 1.10 -1.10 0.37 0.49 2.94 4.90 7.96 3.55 4.16 8.45 9.80 10.78 12.61 6.49 7.84 32.08 38.21 49.11 58.41 8.33 9.80 26.57 31.23 40.53 47.76 13.84 16.41 34.29 40.41 45.31 53.27 69.31 80.95 92.34 108.62 93.93 112.91 3.31 9.06 -1.35 19.59 -10.90 24.49 l-5.39 2.69 -120.75 -0.12 c-91.48 0 -121.97 -0.37 -126.26 -1.59z"></path>
            <path id="p3Blade" pathLength="1" d="M477.11 1076.31 c-8.94 -2.08 -18.86 -8.57 -28.04 -18.12 -10.16 -10.65 -86.70 -102.25 -92.58 -110.83 -2.20 -3.18 -5.63 -9.18 -7.59 -13.47 -7.23 -15.31 -7.23 -15.31 -7.23 -123.81 0 -96.99 0.12 -99.32 2.45 -103.23 1.35 -2.20 3.80 -4.53 5.51 -5.14 6.12 -2.33 10.29 0.98 31.84 25.84 16.53 19.23 92.95 108.13 110.83 129.20 2.33 2.69 13.96 16.16 25.72 30 25.10 29.15 34.78 40.66 58.17 68.46 9.43 11.14 22.90 27.19 30 35.39 7.10 8.33 16.41 19.35 20.82 24.61 4.41 5.14 11.88 14.08 16.65 19.72 4.78 5.63 9.67 12 10.78 14.21 4.16 8.20 1.59 18.49 -6.12 24.37 l-4.53 3.55 -80.95 0.24 c-46.17 0.12 -83.03 -0.37 -85.72 -0.98z"></path>
            <clipPath id="c3All" clipPathUnits="userSpaceOnUse">
              <use href="#p3Body"></use>
              <use href="#p3Blade"></use>
            </clipPath>
            <mask id="m3Stroke">
              <use href="#p3Body" fill="none" stroke="#ffffff" stroke-width="26" stroke-linejoin="round" stroke-dasharray="1" style="animation:rl3-draw 3.2s cubic-bezier(0.45,0.05,0.4,1) infinite"></use>
              <use href="#p3Blade" fill="none" stroke="#ffffff" stroke-width="26" stroke-linejoin="round" stroke-dasharray="1" style="animation:rl3-draw 3.2s cubic-bezier(0.45,0.05,0.4,1) infinite"></use>
            </mask>
            <mask id="m3Flood">
              <g style="animation:rl3-flood 3.2s cubic-bezier(0.5,0.02,0.5,0.98) infinite">
                <rect x="-700" y="0" width="2700" height="1900" fill="#ffffff"></rect>
                <g style="animation:rl3-wave 1.9s linear infinite">
                  <path fill="#ffffff" d="M-700 3 C-590 -28 -470 32 -350 3 C-230 -28 -110 32 10 3 C130 -28 250 32 370 3 C490 -28 610 32 730 3 C850 -28 970 32 1090 3 C1210 -28 1330 32 1450 3 C1570 -28 1690 32 1810 3 C1930 -28 1990 14 2040 3 L2040 80 L-700 80 Z"></path>
                </g>
              </g>
            </mask>
          </defs>

          <g clip-path="url(#c3All)" style="opacity:0.14">
            <rect x="0" y="0" width="1254" height="1254" fill="#F4F7FF"></rect>
          </g>

          <g clip-path="url(#c3All)">
            <image href="/runly/runly-isotipo-dark-md.png" x="0" y="0" width="1254" height="1254" mask="url(#m3Flood)"></image>
          </g>

          <g clip-path="url(#c3All)" mask="url(#m3Stroke)">
            <image href="/runly/runly-isotipo-dark-md.png" x="0" y="0" width="1254" height="1254"></image>
          </g>
        </svg>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:22px;animation:rl3-rise 0.8s cubic-bezier(0.16,1,0.3,1) 0.4s both">
      <div style="display:flex;align-items:baseline;gap:8px">
        <span id="rl3-msg" style="font-size:17px;font-weight:500;color:#F4F7FF">Cargando tu espacio de trabajo</span>
      </div>

      <div style="position:relative;width:256px;height:3px;border-radius:99px;background:rgba(244,247,255,0.12);overflow:hidden">
        <div style="position:absolute;inset:0;border-radius:99px;background:linear-gradient(90deg,#FFB020,#F5411E 55%,#F4F7FF);animation:rl3-bar 2.2s cubic-bezier(0.45,0,0.35,1) infinite"></div>
      </div>

      <span style="font-size:11px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;color:rgba(244,247,255,0.42)">Runly ERP</span>
    </div>
  </div>
</div>

<script>
(function(){
  function sync(){
    var t=document.timeline.currentTime;
    document.getAnimations().forEach(function(a){
      if(typeof a.animationName==='string'&&a.animationName.indexOf('rl3-')===0){ try{a.startTime=t;}catch(e){} }
    });
  }
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(sync);}
  setTimeout(sync,60);
  var msg=new URLSearchParams(location.search).get('msg');
  var msgEl=document.getElementById('rl3-msg');
  if(msg&&msgEl){ msgEl.textContent=msg; }
})();
</script>
</body>
</html>
