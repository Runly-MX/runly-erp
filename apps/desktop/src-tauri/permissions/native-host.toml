[[permission]]
identifier = "allow-host-info"
description = "Read public host metadata."
commands.allow = ["host_info"]

[[permission]]
identifier = "allow-host-connect"
description = "Preflight and connect to the currently configured or a candidate server origin."
commands.allow = ["host_connect"]

[[permission]]
identifier = "allow-host-ready"
description = "Acknowledge successful React mount."
commands.allow = ["host_ready"]

[[permission]]
identifier = "allow-host-events"
description = "Read queued native navigation intents."
commands.allow = ["host_events"]

[[permission]]
identifier = "allow-host-ack-events"
description = "Acknowledge handled native navigation intents."
commands.allow = ["host_ack_events"]

[[permission]]
identifier = "allow-host-open-external"
description = "Open a validated HTTP(S) link in the system browser."
commands.allow = ["host_open_external"]

[[permission]]
identifier = "allow-host-screen-start"
description = "Request Android screen sharing with system consent."
commands.allow = ["host_screen_start"]

[[permission]]
identifier = "allow-host-notification-show"
description = "Show a local Android notification with a validated Atlas deep link."
commands.allow = ["host_notification_show"]

[[permission]]
identifier = "allow-host-screen-stop"
description = "Stop Android screen sharing."
commands.allow = ["host_screen_stop"]

[[permission]]
identifier = "allow-host-screen-status"
description = "Read Android screen sharing state without credentials."
commands.allow = ["host_screen_status"]

[[permission]]
identifier = "allow-host-call-keepalive-start"
description = "Start the Android foreground service that keeps an active call alive with the screen locked."
commands.allow = ["host_call_keepalive_start"]

[[permission]]
identifier = "allow-host-call-keepalive-stop"
description = "Stop the Android active-call foreground service."
commands.allow = ["host_call_keepalive_stop"]

[[permission]]
identifier = "allow-host-audio-routes"
description = "List the Android in-call audio outputs (earpiece, speaker, wired, Bluetooth)."
commands.allow = ["host_audio_routes"]

[[permission]]
identifier = "allow-host-audio-route-set"
description = "Switch the Android in-call audio output."
commands.allow = ["host_audio_route_set"]

[[permission]]
identifier = "allow-host-audio-route-reset"
description = "Hand the Android audio routing back to the system when a call ends."
commands.allow = ["host_audio_route_reset"]

[[permission]]
identifier = "allow-host-proximity-set"
description = "Turn the Android screen off while the phone is held against the ear during a call."
commands.allow = ["host_proximity_set"]

[[permission]]
identifier = "allow-host-confirm-origin"
description = "Persist and navigate to a server origin that already passed preflight."
commands.allow = ["host_confirm_origin"]

[[permission]]
identifier = "allow-host-forget-origin"
description = "Clear the currently trusted server origin."
commands.allow = ["host_forget_origin"]

[[permission]]
identifier = "allow-host-servers"
description = "Manage saved instances exclusively from the bundled shell."
commands.allow = ["host_servers", "host_remove_server", "host_cancel_origin"]

[[permission]]
identifier = "allow-host-manage"
description = "Return to the bundled instance and device manager."
commands.allow = ["host_manage"]

[[permission]]
identifier = "allow-host-device"
description = "Check/request named device permissions and use bounded NFC/Bluetooth operations."
commands.allow = ["host_device"]
