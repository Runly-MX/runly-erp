# Source-mode overlay: docker compose -f docker-compose.yml -f infra/docker/content.compose.yml --profile content up -d content-worker
services:
  api:
    environment:
      RUNLY_CONTENT_WORKER_TOKEN: ${RUNLY_CONTENT_WORKER_TOKEN:?Configure a worker token of at least 32 characters}
    networks: [default, content-private]
  content-worker:
    profiles: [content]
    build:
      context: .
      dockerfile: infra/docker/content-worker.Dockerfile
    environment:
      RUNLY_CONTENT_API_URL: http://api:4010
      RUNLY_CONTENT_WORKER_TOKEN: ${RUNLY_CONTENT_WORKER_TOKEN:?Configure a worker token of at least 32 characters}
      RUNLY_CONTENT_WORKER_ID: local-1
    # Only the API is reachable from the worker: no database, no Storage, no internet (internal network).
    networks: [content-private]
    cpus: ${RUNLY_CONTENT_CPUS:-0.5}
    mem_limit: ${RUNLY_CONTENT_MEMORY:-512m}
    pids_limit: 64
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=268435456,mode=1777,noexec,nosuid,nodev
    init: true
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: '2'

networks:
  content-private:
    internal: true
