# Optional overlay for source-free installations; the image must be supplied by infrastructure.
# Keep the same RUNLY_CONTENT_WORKER_TOKEN in the API's existing private env file.
services:
  # The API service of whichever profile is active joins the private network the worker uses.
  runly-worker-external:
    networks:
      default:
        aliases: [api]
      content-private:
        aliases: [api]
  runly-worker-local:
    networks:
      default:
        aliases: [api]
      content-private:
        aliases: [api]
  content-worker:
    profiles: [content]
    image: ${RUNLY_CONTENT_WORKER_IMAGE:?Provide the verified content-worker image or digest}
    environment:
      RUNLY_CONTENT_API_URL: http://api:4010
      RUNLY_CONTENT_WORKER_TOKEN: ${RUNLY_CONTENT_WORKER_TOKEN:?Configure a separate worker token}
      RUNLY_CONTENT_WORKER_ID: ${RUNLY_CONTENT_WORKER_ID:-local-1}
      # HEIC/HEIF stays OFF until the bundled native decoders (libheif, libde265, x265) are certified for your environment.
      RUNLY_CONTENT_HEIC: ${RUNLY_CONTENT_HEIC:-off}
    # Only the API is reachable from the worker: no database, no Storage, no internet (internal network).
    networks: [content-private]
    cpus: ${RUNLY_CONTENT_CPUS:-0.5}
    mem_limit: ${RUNLY_CONTENT_MEMORY:-512m}
    pids_limit: 64
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=268435456,mode=1777,noexec,nosuid,nodev
    init: true
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: '2'

networks:
  content-private:
    internal: true
