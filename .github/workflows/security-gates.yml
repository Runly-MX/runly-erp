name: Security Gates

# F1B.0.8: the F1A/F1B security suites run on every push and pull request.
# The Docker-based end-to-end verifications (disposable Supabase + real API)
# run on demand; they need no secrets and never reach a real database.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      disposable_stack:
        description: Also run the disposable-stack verifications (Docker)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  security-suites:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm db:generate
        env:
          # Client generation only reads the URL; it does not connect to a DB.
          DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/runly_ci
      - name: Security suites
        run: pnpm test:security

  disposable-stack:
    if: github.event_name == 'workflow_dispatch' && inputs.disposable_stack
    needs: security-suites
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm db:generate
        env:
          DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/runly_ci
      - name: Module authority and quarantine
        run: node scripts/security/verify-module-security.mjs
      - name: PostgREST exposure
        run: node scripts/security/verify-postgrest-exposure.mjs
