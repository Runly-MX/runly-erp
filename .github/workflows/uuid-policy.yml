name: UUID Policy

on:
  push:
  pull_request:

jobs:
  enforce-uuid-policy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: UUID Policy Check
        run: node scripts/enforce-uuid-policy.mjs
