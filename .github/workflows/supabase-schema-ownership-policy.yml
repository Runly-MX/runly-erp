name: Supabase Schema Ownership Policy

on:
  push:
  pull_request:

jobs:
  enforce-supabase-schema-ownership-policy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Supabase Managed-Schema Ownership Check
        run: node scripts/enforce-supabase-schema-ownership-policy.mjs
