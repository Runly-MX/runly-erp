name: Shared packages controlled release
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact reviewed full source SHA reachable from main
        required: true
        type: string
      publish:
        description: Publish after enabling the protected shared-packages environment
        default: false
        type: boolean
      auth_mode:
        description: Bootstrap PAT only for first release; github-token after access is verified
        default: github-token
        type: choice
        options:
          - github-token
          - bootstrap
permissions:
  contents: read
concurrency:
  group: shared-packages-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reviewed revision
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REVISION"
          git merge-base --is-ancestor "$REVISION" origin/main
          test -z "$(git status --porcelain)"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          registry-url: https://npm.pkg.github.com
          scope: '@runly-mx'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Directed package tests
        run: |
          pnpm --filter @runly/core --filter @runly/module-engine test
          node --test packages/module-compiler/src/__tests__/archive.test.js packages/module-compiler/src/__tests__/package-contracts.test.js packages/module-compiler/src/__tests__/static-inspection.test.js
          node --test scripts/tests/shared-package-release.test.mjs
      - name: Build and validate package contents
        env:
          REVISION: ${{ inputs.revision }}
        run: pnpm release:shared --revision "$REVISION"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-package-manifest-and-tarballs
          path: .artifacts/shared-release/
          if-no-files-found: error
  publish:
    needs: prepare
    if: ${{ inputs.publish && inputs.auth_mode == 'github-token' }}
    runs-on: ubuntu-latest
    environment: shared-packages
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          registry-url: https://npm.pkg.github.com
          scope: '@runly-mx'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Publish explicitly enabled private packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNLY_SHARED_PUBLISH_ENABLED: ${{ vars.RUNLY_SHARED_PUBLISH_ENABLED }}
          RUNLY_SHARED_GITHUB_TOKEN_ACCESS_VERIFIED: ${{ vars.RUNLY_SHARED_GITHUB_TOKEN_ACCESS_VERIFIED }}
          REVISION: ${{ inputs.revision }}
        run: pnpm release:shared --revision "$REVISION" --publish --auth-mode github-token
      - uses: actions/upload-artifact@v4
        with:
          name: published-shared-package-manifest
          path: .artifacts/shared-release/
  bootstrap:
    needs: prepare
    if: ${{ inputs.publish && inputs.auth_mode == 'bootstrap' }}
    runs-on: ubuntu-latest
    environment: shared-packages-bootstrap
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          registry-url: https://npm.pkg.github.com
          scope: '@runly-mx'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Bootstrap private org packages with temporary administrative PAT
        env:
          NODE_AUTH_TOKEN: ${{ secrets.RUNLY_SHARED_BOOTSTRAP_TOKEN }}
          RUNLY_SHARED_PUBLISH_ENABLED: ${{ vars.RUNLY_SHARED_PUBLISH_ENABLED }}
          REVISION: ${{ inputs.revision }}
        run: pnpm release:shared --revision "$REVISION" --publish --auth-mode bootstrap
      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap-shared-package-manifest
          path: .artifacts/shared-release/
