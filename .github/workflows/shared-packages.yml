name: Shared packages controlled release
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact reviewed full source SHA reachable from main
        required: true
        type: string
      publish:
        description: Publish after enabling the protected shared-packages environment
        default: false
        type: boolean
      package:
        description: Optional single package (empty releases all shared packages)
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: shared-packages-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reviewed revision
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REVISION"
          git merge-base --is-ancestor "$REVISION" origin/main
          test -z "$(git status --porcelain)"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.3
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com
          scope: '@runly-mx'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Directed package tests
        run: |
          pnpm --filter @runly/core --filter @runly/module-engine --filter @runly/studio-interchange test
          node --test packages/module-compiler/src/__tests__/archive.test.js packages/module-compiler/src/__tests__/package-contracts.test.js packages/module-compiler/src/__tests__/static-inspection.test.js
          node --test packages/module-compiler/src/__tests__/entity-list.test.js packages/module-compiler/src/__tests__/entity-list-integration.test.js
          node --test scripts/tests/shared-package-release.test.mjs
      - name: Build and validate package contents
        env:
          REVISION: ${{ inputs.revision }}
          PACKAGE: ${{ inputs.package }}
        run: |
          args=(--revision "$REVISION")
          if [[ -n "$PACKAGE" ]]; then args+=(--package "$PACKAGE"); fi
          pnpm release:shared "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: shared-package-manifest-and-tarballs
          path: .artifacts/shared-release/
          if-no-files-found: error
  publish:
    needs: prepare
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    environment: shared-packages
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.3
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com
          scope: '@runly-mx'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Publish explicitly enabled private packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNLY_SHARED_PUBLISH_ENABLED: ${{ vars.RUNLY_SHARED_PUBLISH_ENABLED }}
          REVISION: ${{ inputs.revision }}
          PACKAGE: ${{ inputs.package }}
        run: |
          args=(--revision "$REVISION" --publish)
          if [[ -n "$PACKAGE" ]]; then args+=(--package "$PACKAGE"); fi
          pnpm release:shared "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: published-shared-package-manifest
          path: .artifacts/shared-release/
